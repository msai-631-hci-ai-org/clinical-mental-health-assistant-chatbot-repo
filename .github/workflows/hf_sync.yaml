name: Hugging Face Sync

on:
  push:
    branches:
      - feature/derrick-enhancements

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: test-environment

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # FIXED: Downloads the explicit x64 Linux binary directly into a global system folder
      - name: Install Git Xet extension
        run: |
          curl -L -o git-xet.tar.gz https://github.com
          tar -xzf git-xet.tar.gz
          sudo mv git-xet /usr/local/bin/
          rm git-xet.tar.gz
          
          # Verify installation works before continuing
          git xet --version

      - name: Push updates to Hugging Face (Excluding README)
        env:
          HF_TOKEN: ${{ secrets.HF_WORKFLOW_TOKEN }}
        run: |
          # 1. Initialize Git Xet configuration globally
          git xet install
          
          # 2. Configure local runner Git info
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          
          # 3. Add Hugging Face as a remote repository destination
          git remote add hf https://DerrickDK777:$HF_TOKEN@huggingface.co/spaces/DerrickDK777/C-MHA-TEST
          
          # 4. Fetch Hugging Face's history
          git fetch hf main || true
          
          # 5. Overwrite local runner README with HF's version
          git checkout hf/main -- README.md || echo "No remote README found to preserve"
          
          # 6. Re-stage everything so Git Xet intercepts the binary files correctly
          git add -A
          git commit -m "Keep Hugging Face README intact and prepare binaries [skip ci]" || echo "No changes to commit"
          
          # 7. Push safely (Git Xet handles the binary files automatically behind the scenes)
          git push -f hf HEAD:main
